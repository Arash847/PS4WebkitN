<!DOCTYPE html>
<html>
<head>
<title>PS4 WebKit Jailbreak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05, 5.07 and 7.00 to 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<main class="card">
    <img class="logo" src="logo.png" alt="GoldHEN">
    <div class="eyebrow">PS Torghabeh</div>
    <h1 class="title">PS4 WebKit Jailbreak</h1>
    <div class="subtitle">FIRMWARE 5.05 &mdash; 13.52</div>
    <div class="fw-badge" id="fwbadge">GOLDHEN v2.4b18.12</div>
    <div class="progress-wrap" id="progress-wrap">
        <div class="progress-info">
            <span id="progress-label">Initializing...</span>
            <span id="progress-pct"></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    <h1 id="msgs">Loading GoldHEN v2.4b18.12... Please Wait</h1>
</main>
<script>
(function () {
    function $(id) { return document.getElementById(id); }

    var ua = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
    if (!ua) {
        $("progress-wrap").style.display = "none";
        return;
    }
    $("fwbadge").innerHTML = "FW " + ua[1] + " &middot; GOLDHEN v2.4b18.12";

    var pct = 0;
    var fill = $("progress-fill");
    var num = $("progress-pct");
    var label = $("progress-label");
    var stopped = false;

    var timer = setInterval(function () {
        var m = $("msgs");
        var t = m ? m.innerHTML : "";
        if (t.indexOf("Loaded") !== -1) {
            fill.className = "progress-fill success";
            fill.style.width = "100%";
            num.innerHTML = "100%";
            label.innerHTML = "Done!";
            stopped = true;
        } else if (t.indexOf("Failed") !== -1 || t.indexOf("Error") !== -1
                || t.indexOf("Unsupported") !== -1 || t.indexOf("not Found") !== -1) {
            fill.className = "progress-fill error";
            fill.style.width = "100%";
            num.innerHTML = "";
            label.innerHTML = "Error";
            stopped = true;
        }
        if (stopped) { clearInterval(timer); return; }
        if (pct < 90) {
            pct += 3;
            fill.style.width = pct + "%";
            num.innerHTML = pct + "%";
        }
    }, 400);
})();
</script>
</body>
</html>
